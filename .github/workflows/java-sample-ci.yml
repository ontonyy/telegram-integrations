name: Java sample CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Run credential-free tests
        working-directory: examples/java-spring
        run: ./gradlew clean test

      - name: Configure Telegram delivery for trusted default-branch runs
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
            echo "TELEGRAM_SEND_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "TELEGRAM_SEND_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::Telegram notification disabled; configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to opt in."
          fi

      - name: Notify Telegram about the workflow result
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: examples/java-spring
        env:
          CI_JOB_STATUS: ${{ job.status }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: ./gradlew -q notifyTelegram
